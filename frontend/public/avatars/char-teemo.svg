<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#2D5A0A"/>
  <!-- Mushroom cap -->
  <path d="M 14 46 Q 14 12 50 10 Q 86 12 86 46 Z" fill="#8B4513"/>
  <!-- Cap white spots -->
  <circle cx="33" cy="28" r="6" fill="white"/>
  <circle cx="50" cy="22" r="5" fill="white"/>
  <circle cx="67" cy="28" r="6" fill="white"/>
  <circle cx="24" cy="40" r="4" fill="white"/>
  <circle cx="76" cy="40" r="4" fill="white"/>
  <!-- Cap rim -->
  <path d="M 14 46 Q 14 54 50 54 Q 86 54 86 46 Z" fill="#A0522D"/>
  <!-- Ears -->
  <ellipse cx="28" cy="62" rx="10" ry="8" fill="#C8956C" transform="rotate(-20,28,62)"/>
  <ellipse cx="72" cy="62" rx="10" ry="8" fill="#C8956C" transform="rotate(20,72,62)"/>
  <!-- Face -->
  <circle cx="50" cy="70" r="24" fill="#C8956C"/>
