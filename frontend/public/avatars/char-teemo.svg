  <circle cx="60" cy="68" r="9" fill="white"/>
  <circle cx="41" cy="69" r="6" fill="#4A3520"/>
  <circle cx="61" cy="69" r="6" fill="#4A3520"/>
  <circle cx="39" cy="66" r="2" fill="white"/>
  <circle cx="59" cy="66" r="2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="76" rx="4" ry="3" fill="#B07040"/>
  <!-- Whiskers -->
  <line x1="26" y1="74" x2="42" y2="76" stroke="#A06030" stroke-width="1.5" opacity="0.7"/>
  <line x1="26" y1="78" x2="42" y2="78" stroke="#A06030" stroke-width="1.5" opacity="0.7"/>
  <line x1="58" y1="76" x2="74" y2="74" stroke="#A06030" stroke-width="1.5" opacity="0.7"/>
  <line x1="58" y1="78" x2="74" y2="78" stroke="#A06030" stroke-width="1.5" opacity="0.7"/>
</svg>
